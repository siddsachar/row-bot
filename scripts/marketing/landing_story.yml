schema: 1
story:
  id: sovereignty-workbench-v1
  prompt_version: 1
  max_generation_attempts: 6
  buddy_pack: orbit

models:
  local: model:ollama:qwen3.8:27b
  frontier: model:codex:gpt-5.6-sol

viewports:
  desktop:
    width: 1920
    height: 1200
  mobile:
    width: 390
    height: 844

canonical_task: >-
  Research how local-first AI changes ownership and control of knowledge work.
  Use Row-Bot's public documentation and approved public sources to create a
  concise campaign brief, a visual launch concept, and a recurring weekly
  intelligence workflow. Keep file writes and external delivery behind approval.

scenes:
  - id: hero-app
    surface: conversation
    record: local-first-ai-landscape
    state: settled
    framing: app-window
    viewport: desktop
    model_role: local
    outputs: [webp]
    asset: hero-app
    public_safe: true
    alt: >-
      Row-Bot conversation using a local Qwen model with sources and Activity
      visible in the connected workspace.

  - id: research-local
    surface: conversation
    record: local-first-ai-landscape
    state: sources-open
    framing: app-window
    viewport: desktop
    model_role: local
    outputs: [webp, webm]
    asset: research-local
    public_safe: true
    alt: >-
      A real local-model research result with public sources and a reviewed tool
      trace inside Row-Bot.

  - id: synthesis-sol
    surface: conversation
    record: campaign-narrative
    state: settled
    framing: app-window
    viewport: desktop
    model_role: frontier
    outputs: [webp]
    asset: synthesis-sol
    public_safe: true
    alt: >-
      Row-Bot campaign synthesis with the hosted GPT-5.6 Sol route shown
      explicitly in the conversation.

  - id: knowledge-control
    surface: knowledge
    state: populated
    framing: app-window
    viewport: desktop
    model_role: local
    outputs: [webp, webm]
    asset: knowledge-control
    public_safe: true
    alt: >-
      Row-Bot knowledge graph populated from the public-safe local-first AI
      research workspace.

  - id: designer-output
    surface: designer
    record: landing-visual-direction
    state: editor-open
    framing: app-window
    viewport: desktop
    model_role: frontier
    outputs: [webp]
    asset: designer-output
    public_safe: true
    alt: >-
      A real editable launch visual open in Row-Bot Designer Studio.

  - id: workflow-repeat
    surface: workflow
    record: weekly-sovereignty-watch
    state: completed-run
    framing: app-window
    viewport: desktop
    model_role: local
    outputs: [webp]
    asset: workflow-repeat
    public_safe: true
    alt: >-
      A disabled-delivery Row-Bot workflow with one successful local-model run.

  - id: approval-boundary
    surface: approval
    state: pending
    framing: detail
    viewport: desktop
    outputs: [webp, webm]
    asset: approval-boundary
    public_safe: true
    alt: >-
      Row-Bot asking for approval before a reversible write in the public-safe
      marketing workspace.

  - id: model-choice
    surface: model-picker
    state: open
    framing: detail
    viewport: desktop
    outputs: [webp]
    asset: model-choice
    public_safe: true
    alt: >-
      Row-Bot model picker showing explicit local Qwen and hosted GPT-5.6 Sol
      choices.

  - id: mobile-shell
    surface: home
    state: knowledge-open
    framing: mobile
    viewport: mobile
    outputs: [webp]
    asset: mobile-shell
    public_safe: true
    alt: >-
      The same public-safe Row-Bot workspace at a mobile browser width.
