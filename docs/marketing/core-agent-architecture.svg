<title id="title">Row-Bot Core Agent Architecture</title>
<desc id="desc">One React client and the channels reach a local FastAPI server; one agent orchestrator assembles context, calls provider-qualified models and tools, delegates to child agents, and pauses for approvals; memory, workflows and storage stay on the host.</desc>
