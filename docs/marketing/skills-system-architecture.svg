<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="title">Row-Bot Skills System Architecture</title>
<desc id="desc">Skills come from bundled packs, your own files and the Skills Hub; the activation runtime resolves pinned, requested and up to five automatically selected skills per task; prompt assembly adds only their instructions and active tool guides, inside the same tool, approval and budget boundaries.</desc>
