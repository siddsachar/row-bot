<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="title">Row-Bot Developer Panel Architecture</title>
<desc id="desc">A request in the chat or Add resource binds a code folder; developer tools read, edit, run and use Git under the conversation&#x27;s approval mode; the Developer panel shows changes, files, checks and Git; the terminal dock opens your own shell.</desc>
