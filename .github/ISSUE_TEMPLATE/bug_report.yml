name: Bug report
description: Report something broken in Row-Bot
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include API keys or private data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Row-Bot version
      placeholder: v5.3.1
  - type: dropdown
    id: runs_on
    attributes:
      label: Where does Row-Bot run?
      options:
        - Desktop app (Windows, macOS or Linux)
        - Docker on my own computer or server
        - A hosting service (say which below)
        - Other
    validations:
      required: true
  - type: input
    id: host_size
    attributes:
      label: Which host, and what size?
      description: For Docker, a hosting service or another server.
      placeholder: e.g. 4 GB memory, 2 cores
  - type: dropdown
    id: memory_notice
    attributes:
      label: Did Row-Bot show an out-of-memory notice?
      options:
        - "No"
        - "Yes"
        - Not sure
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: For the desktop app. Skip it for Docker or a hosting service.
      options:
        - Windows
        - macOS Apple Silicon
        - macOS Intel
        - Linux
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste only the relevant part. Remove secrets first.
      render: text
