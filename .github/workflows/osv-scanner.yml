name: OSV Scanner

# Every pull request to main and feat/org, so the scan is a check each one
# reports (a path filter would leave a required check waiting), and weekly for
# advisories published since.
on:
  pull_request:
    branches: [main, feat/org]
  schedule:
    - cron: "24 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Scan committed lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=uv.lock
            --lockfile=docs-site/package-lock.json
            --lockfile=frontend/package-lock.json
            --lockfile=src/row_bot/channels/whatsapp_bridge/package-lock.json
