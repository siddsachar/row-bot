name: Docs

# The docs' sources and the landing page are checked on every change to them. The published docs site
# (docs/docs, its assets and search index) is rebuilt only when a release is prepared
# (scripts/docs/publish.py): a pull request that changes it is a publish, and only then is the committed
# site compared with a fresh build. The landing page changes by hand, after a release, with the
# `landing` label.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # A release tag checks that the docs published with it are current (paths don't apply to tags).
    tags: ["v*"]
    paths:
      - ".github/workflows/docs.yml"
      - "docs-site/**"
      - "docs/**"
      - "docs-content/**"
      - "scripts/docs/**"
      - "scripts/smoke_docker_server.py"
      - "tests/docs/**"
      # The Railway page's tests check its calls against the relay's allow-list.
      - "services/railway-relay/src/**"
      - "scripts/marketing/**"
      - "tests/marketing/**"
      - "README.md"
      - "RELEASE_NOTES.md"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - ".github/workflows/docs.yml"
      - "docs-site/**"
      - "docs/**"
      - "docs-content/**"
      - "scripts/docs/**"
      - "scripts/smoke_docker_server.py"
      - "tests/docs/**"
      # The Railway page's tests check its calls against the relay's allow-list.
      - "services/railway-relay/src/**"
      - "scripts/marketing/**"
      - "tests/marketing/**"
      - "README.md"
      - "RELEASE_NOTES.md"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    env:
      DOCS_NODE_IMAGE: "node:20.20.2-bookworm"
      DOCS_NODE_PLATFORM: "linux/amd64"
      NO_UPDATE_NOTIFIER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python docs dependencies
        run: python -m pip install pyyaml pytest pillow

      - name: What this change touches
        id: change
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$PR_BASE"
          [ "$EVENT" = "push" ] && base="$PUSH_BASE"
          git diff --name-only "$base"...HEAD > "$RUNNER_TEMP/changed.txt"
          echo "publish=$(python scripts/docs/landing_guard.py --published < "$RUNNER_TEMP/changed.txt")" >> "$GITHUB_OUTPUT"

      - name: The landing page changes only with the landing label
        if: github.event_name == 'pull_request'
        env:
          LANDING_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'landing') }}
        run: python scripts/docs/landing_guard.py --landing --allowed "$LANDING_LABEL" < "$RUNNER_TEMP/changed.txt"

      - name: Collect docs inventory
        run: python scripts/docs/collect_inventory.py --out docs-build/inventory

      - name: Check generated reference pages
        if: steps.change.outputs.publish == 'true'
        run: python scripts/docs/generate_mdx.py --inventory docs-build/inventory --check

      - name: Generate LLM docs files
        run: python scripts/docs/generate_llms_txt.py --docs-root docs-site/docs --out-dir docs-site/static

      - name: Validate committed screenshots
        run: python scripts/docs/capture_real_ui_screenshots.py --validate-only

      - name: Validate docs source
        env:
          ROW_BOT_DOCS_PUBLISH: ${{ steps.change.outputs.publish }}
        run: python scripts/docs/validate_public_docs.py

      - name: Build docs review report
        run: python scripts/docs/build_review_report.py

      # The app's own lanes leave these to this workflow.
      - name: Run docs and marketing tooling tests
        env:
          ROW_BOT_DOCS_PUBLISH: ${{ steps.change.outputs.publish }}
        run: pytest tests/docs tests/marketing -q

      # Every change builds the site, so a broken page is caught where it's made; a publish also checks
      # that the committed site is exactly that build.
      - name: Build and verify published docs in canonical container
        env:
          PUBLISH: ${{ steps.change.outputs.publish }}
        run: |
          docker run --rm \
            --platform "$DOCS_NODE_PLATFORM" \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/repo" \
            --env NO_UPDATE_NOTIFIER \
            --env PUBLISH \
            "$DOCS_NODE_IMAGE" \
            bash -lc "ln -sf /usr/bin/python3 /usr/local/bin/python && cd /repo/docs-site && npm ci && npm run build:ci && cd /repo && if [ \"\$PUBLISH\" = true ]; then python scripts/docs/sync_github_pages.py --check; fi"
