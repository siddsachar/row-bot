name: CI

# Every job runs in parallel; `ci-ok` is the one required check. The
# deterministic suite runs once, on Linux, split into shards; the tests marked
# `platform` also run on Windows (the shipped Python 3.13) and macOS. The full
# suite on every OS, the slow tests and the browser nightly set run in
# nightly.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request's run; every commit on main keeps its
  # own completed run (the release gate looks for it).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ">=0.7,<1.0"
          python-version: ${{ steps.python.outputs.python-path }}

      - name: Lock files, ruff safety, dependency and client-platform checks
        run: uv run python scripts/run_test_matrix.py quality

      - name: Ruff full check (advisory)
        continue-on-error: true
        run: uv run --group lint ruff check . --output-format=github

      - name: Ruff format check (advisory)
        continue-on-error: true
        run: uv run --group lint ruff format --check .

      - name: Validate Linux installer scripts
        run: bash -n build_linux_app.sh installer/build_linux_app.sh installer/install-linux.sh

  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build local client assets
        uses: ./.github/actions/build-client

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint, format, types, unit tests and build
        run: python scripts/run_test_matrix.py client-foundation

  python:
    name: Python (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v7

      - name: Build local client assets
        uses: ./.github/actions/build-client

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ">=0.7,<1.0"
          python-version: ${{ steps.python.outputs.python-path }}

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libxcb-cursor0 libportaudio2

      - name: Install Python packages
        run: uv sync --locked --all-extras --group test

      - name: Verify required runtime dependencies
        if: matrix.shard == '1/3'
        run: uv run python scripts/verify_runtime_dependencies.py all

      - name: Verify packaged client assets
        if: matrix.shard == '1/3'
        run: uv run python scripts/verify_client_assets.py --root src/row_bot/static/client-v2 --compare frontend/dist --strict

      - name: Deterministic tests (one shard)
        env:
          ROW_BOT_TEST_SHARD: ${{ matrix.shard }}
        run: uv run python scripts/run_test_matrix.py python

      - name: App smoke
        if: matrix.shard == '1/3'
        run: uv run python scripts/run_test_matrix.py app-smoke

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ strategy.job-index }}
          path: .tmp/coverage/python.xml
          if-no-files-found: ignore
          retention-days: 14

  platform:
    name: Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7

      - name: Build local client assets
        uses: ./.github/actions/build-client

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ">=0.7,<1.0"
          python-version: ${{ steps.python.outputs.python-path }}

      - name: Install macOS runtime libraries
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install Python packages
        run: uv sync --locked --all-extras --group test

      - name: Runtime dependencies, platform tests and the launcher smoke
        run: uv run python scripts/run_test_matrix.py platform

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build local client assets
        uses: ./.github/actions/build-client

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ">=0.7,<1.0"
          python-version: ${{ steps.python.outputs.python-path }}

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libxcb-cursor0 libportaudio2

      - name: Install Python packages
        run: uv sync --locked --all-extras --group test

      - name: Read the locked Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser runner points Playwright at .tmp/p2-browser-cache.
      - name: Restore the Playwright browser cache
        uses: actions/cache@v6
        with:
          path: .tmp/p2-browser-cache
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its system libraries
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/p2-browser-cache
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Browser smoke set (Chromium desktop)
        run: uv run python scripts/run_test_matrix.py browser-smoke

      # Fixture data only: a throwaway backend with fake providers; the runner
      # replaces its control token and local paths in the logs.
      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-evidence
          path: .local/evidence/unified-client-platform/phase-3-visual-alignment/qa
          if-no-files-found: ignore
          retention-days: 7

  ci-ok:
    name: ci-ok
    if: always()
    # Browser smoke is not required yet; it joins once it has been green for a week.
    needs: [quality, client, python, platform]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required CI job ended with: $result"; exit 1 ;;
            esac
          done
          echo "Required jobs: $RESULTS"
