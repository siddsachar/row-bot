# Docs metadata for the React settings pages. Page ids, labels, groups and
# searchable rows come from frontend/src/features/settings/model.ts; every page
# there needs exactly one entry here (collect_inventory.py fails otherwise).
pages:
  preferences:
    description: Set the assistant's name and personality, learning new skills, how
      Row-Bot opens, and the overnight Dream Cycle.
    docs_route: /docs/settings/preferences
    screenshot_id: settings-preferences
  appearance:
    description: Choose this device's theme, accent colour, density, and transparency,
      or reset the panel sizes.
    docs_route: /docs/settings/preferences
  buddy:
    description: Configure companion visibility, look, new looks, personality, bubbles,
      and motion, and the drag-to-undock desktop overlay.
    docs_route: /docs/settings/buddy
    screenshot_id: settings-buddy
    dependencies: Desktop overlay behaviour depends on native-window support.
  providers:
    description: Connect hosted, subscription, local, cloud, and custom model providers.
    docs_route: /docs/settings/providers
    screenshot_id: settings-providers
    security: Credentials are stored through the configured secret store; values are
      not shown in this reference.
  models:
    description: Choose which model does each job (Brain, Vision, Image, Video), the
      reading limit and limits for long work, and pin models from the catalog.
    docs_route: /docs/settings/models
    screenshot_id: settings-models
  voice:
    description: Configure realtime talk, dictation, the Whisper model size, and
      read-aloud.
    docs_route: /docs/settings/voice
    screenshot_id: settings-voice
    dependencies: Voice extras, provider credentials, and OS audio permissions may be
      required.
  knowledge:
    description: Turn memory on or off, check graph health, configure the wiki vault,
      and delete all knowledge. Memories themselves are managed in Home › Knowledge.
    docs_route: /docs/settings/knowledge
    screenshot_id: settings-knowledge
  documents:
    description: Choose where search runs and its model, maintain the search index, and
      upload documents.
    docs_route: /docs/settings/documents
    screenshot_id: settings-documents
  tracker:
    description: Turn the habit and health tracker on or off and manage its local
      records.
    docs_route: /docs/settings/tracker
    screenshot_id: settings-tracker
  tools:
    description: Configure progressive external-tool loading, retrieval compression,
      search and knowledge tools, built-in tools, and custom tools.
    docs_route: /docs/settings/tools
    screenshot_id: settings-tools
  skills:
    description: Find, add, try and remove skills, and open the skill editor to create
      or edit one.
    docs_route: /docs/settings/skills
    security: Adding a skill turns it on; scripts inside a skill never run when it is
      added.
  apps:
    description: Find and connect the services Row-Bot can work in, including the
      GitHub, Google and X accounts, messaging channels and key-based tools built into
      Row-Bot; choose what each app may do, change its settings, turn apps off or
      remove them, and manage catalogs and custom connections.
    docs_route: /docs/settings/apps
    security: Nothing is fetched or run until you agree; deleting, sending, paying,
      publishing, running code and unknown actions always ask first. Signing in to an
      account opens an external authorisation flow, and a running channel can receive
      or deliver real messages.
    dependencies: Apps that run on this computer may need Node.js or uv, which Row-Bot
      prepares after you agree. Channels need the matching channel extra and
      third-party account configuration.
  system:
    description: Configure the workspace folder, what Row-Bot may do (commands, files,
      browser and Computer Use), and logging.
    docs_route: /docs/settings/system
    screenshot_id: settings-system
    security: Filesystem, shell, browser, and Computer Use controls can widen local
      access.
  access:
    description: Connect a phone or computer, review signed-in devices, and choose
      network access or a public link.
    docs_route: /docs/operations/remote-access
    screenshot_id: settings-remote-access
    security: Invitations grant full owner access; network access and public links
      widen who can reach Row-Bot.
  updates:
    description: Choose the update channel and check for new versions.
    docs_route: /docs/operations/
  data:
    description: Back up and restore Row-Bot data, import from another assistant, and
      run irreversible clean-up.
    docs_route: /docs/operations/
