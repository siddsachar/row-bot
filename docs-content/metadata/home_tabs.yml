# Docs metadata for the React Home tabs. Tab ids come from `homeTabs` in
# frontend/src/features/shell/Home.tsx and open at /app-v2/?tab=<id>; every tab
# there needs exactly one entry here (collect_inventory.py fails otherwise).
tabs:
  overview:
    title: Overview
    docs_route: /docs/home/
    source: frontend/src/features/home/OverviewHome.tsx
  workflows:
    title: Workflows
    docs_route: /docs/home/workflows
    screenshot_id: home-workflows
    source: frontend/src/features/tasks/TaskLibrary.tsx
  knowledge:
    title: Knowledge
    docs_route: /docs/home/knowledge
    screenshot_id: home-knowledge
    source: frontend/src/features/home/KnowledgeHome.tsx
  monitor:
    title: Monitor
    docs_route: /docs/home/monitor
    screenshot_id: home-monitor
    source: frontend/src/features/home/MonitorHome.tsx
  insights:
    title: Insights
    docs_route: /docs/home/
    source: frontend/src/features/home/InsightsHome.tsx
