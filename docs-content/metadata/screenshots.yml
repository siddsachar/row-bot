# Committed public screenshots of the React client. Each capture target opens
# a route under /app-v2/ in an isolated, seeded demo profile, runs its actions,
# waits for capture_selector and expected_text, then captures the window.
# `capture_real_ui_screenshots.py --validate-only` checks every image here.
# Desktop frames are a 1920x1080 window at twice the pixel density
# (3840x2160); phone frames are 390x844. All captures use the light theme.
desktop_defaults: &desktop
  status: required
  scenario: configured
  viewport: desktop
  source: isolated-demo-data
  review_status: approved
  public_asset: true
  # Both seeded approvals count as already announced on this device, so the
  # floating "needs your approval" notice does not cover every screen.
  local_storage: &announced
    row-bot.approvals-announced.v1: '["d0c5a0000001","d0c5a0000002"]'
mobile_defaults: &mobile
  status: required
  scenario: mobile
  viewport: mobile
  source: isolated-demo-data
  review_status: approved
  public_asset: true
  local_storage: *announced
screenshots:
  first-launch-setup-wizard:
    <<: *desktop
    title: How should Row-Bot think?
    scenario: first-run
    source: isolated-first-launch
    output: first-launch-setup-wizard.png
    alt: The first run asks how Row-Bot should think, with cards for a model on this computer, a subscription and an API key, plus a custom endpoint.
    docs_pages: [/docs/getting-started/first-launch]
    route: /app-v2/
    capture_selector: section.first-run
    expected_text: ["How should Row-Bot think?", "Ollama is running"]
  setup-center:
