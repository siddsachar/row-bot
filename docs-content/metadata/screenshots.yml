# Committed public screenshots. `capture_real_ui_screenshots.py --validate-only`
# checks every image here. The capture targets (route, capture_selector,
# wait_for, actions, expected_text) were written for the retired client and
# have been removed; automated capture refuses until each screenshot gets a
# React target: a route under /app-v2/, a capture_selector and expected_text.
desktop_defaults: &desktop
  status: required
  scenario: configured
  viewport: desktop
  source: isolated-demo-data
  review_status: approved
  public_asset: true
mobile_defaults: &mobile
  status: required
  scenario: mobile
  viewport: mobile
  source: isolated-demo-data
  review_status: approved
  public_asset: true
screenshots:
