# Temporary OSV exceptions for packages that do not yet have a compatible fix.
#
# Keep these package/version-specific overrides narrow and time-bound. Fixed
# dependencies should be upgraded instead of added to this file.

[[PackageOverrides]]
name = "setuptools"
version = "81.0.0"
ecosystem = "PyPI"
vulnerability.ignore = true
effectiveUntil = 2026-11-30
reason = "Fixed in 83.0.0, but Torch 2.11 requires setuptools<82 (re-checked 2026-10-29); it moves with Torch once a matching Torchaudio CPU release exists."

[[PackageOverrides]]
name = "torch"
version = "2.11.0"
ecosystem = "PyPI"
vulnerability.ignore = true
effectiveUntil = 2026-11-30
reason = "Fixed in 2.13.0, but Torchaudio has no release after 2.11.1 on PyPI or the CPU index (re-checked 2026-10-29) and FunASR needs it, so the two stay pinned as a pair. The advisory is torch.jit.script memory corruption with local access; Row-Bot never scripts untrusted code."

[[PackageOverrides]]
name = "torch"
version = "2.11.0+cpu"
ecosystem = "PyPI"
vulnerability.ignore = true
effectiveUntil = 2026-11-30
reason = "Fixed in 2.13.0, but Torchaudio has no release after 2.11.1 on PyPI or the CPU index (re-checked 2026-10-29) and FunASR needs it, so the two stay pinned as a pair. The advisory is torch.jit.script memory corruption with local access; Row-Bot never scripts untrusted code."

[[PackageOverrides]]
name = "braces"
version = "3.0.3"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-11-05
reason = "GHSA-vfj7-8cjw-p6xm (deeply nested patterns) has no fixed release; 3.0.3 is the latest (re-checked 2026-10-05). Only the docs-site build tooling uses it, on the repository's own file patterns; nothing Row-Bot ships includes it."

[[PackageOverrides]]
name = "http-cache-semantics"
version = "4.2.0"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-11-05
reason = "GHSA-ch52-4w7c-c8xp (max-stale cross-user cache) has no fixed release; 4.2.0 is the latest (re-checked 2026-10-05). Only the docs-site build tooling uses it, as a single-user build-time cache; nothing Row-Bot ships includes it."

[[PackageOverrides]]
name = "tinypool"
version = "1.1.1"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-11-10
reason = "GHSA-5gmw-xhrv-c9v3 and GHSA-85c8-ppgw-ccpr are fixed only in tinypool 2.x, and @docusaurus/core (3.10.2, the latest) requires ^1.0.2 (re-checked 2026-10-10). Only the docs-site build uses it, on the repository's own pages; nothing Row-Bot ships includes it."

[[PackageOverrides]]
name = "sprintf-js"
version = "1.0.3"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-11-10
reason = "GHSA-hp3w-g68c-fv3c lists no fixed release, and argparse 1.x requires sprintf-js ~1.0.2, whose latest is 1.0.3 (re-checked 2026-10-10). Only the docs-site build tooling uses it; nothing Row-Bot ships includes it."

[[PackageOverrides]]
name = "postcss-selector-parser"
version = "6.1.4"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-11-10
reason = "GHSA-rj75-hqrm-r3gf is fixed only in 7.1.6; the cssnano 6 plugins Docusaurus builds with require ^6.0.16 (re-checked 2026-10-10); the 7.x copies are updated. Only the docs-site build uses it, on the repository's own CSS; nothing Row-Bot ships includes it."

[[PackageOverrides]]
name = "deepmerge"
version = "4.3.1"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-11-30
reason = "GHSA-gcqx-w48m-w2h4 (prototype poisoning of merged objects, low) lists no fixed release; 4.3.1 is the latest (re-checked 2026-10-29). Only the docs-site build uses it, through @svgr/plugin-svgo merging its own SVGO config; nothing Row-Bot ships includes it."

[[PackageOverrides]]
name = "minimatch"
version = "3.1.5"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-11-30
reason = "GHSA-g3hv-75wg-m249 (glob pattern amplification) is fixed only in 11.0.1, and serve-handler (6.1.7, the latest) pins minimatch 3.1.5 exactly (re-checked 2026-11-01). Only the docs-site's local preview server uses it, on the repository's own patterns; nothing Row-Bot ships includes it."

[[PackageOverrides]]
name = "minimatch"
version = "10.2.6"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-11-30
reason = "GHSA-g3hv-75wg-m249 (glob pattern amplification) is fixed only in 11.0.1, and ESLint 10.14.0 (the latest) and its config and TypeScript parsers require ^10.2 (re-checked 2026-11-01). A dev-only lint dependency of the client, run on the repository's own patterns; nothing Row-Bot ships includes it."
